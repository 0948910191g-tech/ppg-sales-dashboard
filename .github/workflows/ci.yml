name: Phase 1 Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run backend and dashboard contract tests
        shell: bash
        run: |
          set -o pipefail
          node --test backend/tests/*.test.mjs tests/*.test.mjs 2>&1 | tee test-output.txt

      - name: Install browser smoke dependency
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run dashboard browser smoke test
        shell: bash
        run: |
          set -o pipefail
          node tests/dashboard-browser-smoke.mjs 2>&1 | tee browser-smoke-output.txt

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-test-output
          path: |
            test-output.txt
            browser-smoke-output.txt
          if-no-files-found: warn
