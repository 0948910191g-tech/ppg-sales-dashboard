name: One-time Review Filter Scope Repair

on:
  push:
    branches:
      - fix/full-ui-route-audit
    paths:
      - scripts/fix-review-filter-scope.mjs
      - .github/workflows/repair-review-filter-scope.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-ui-route-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Review filter scope repair
        run: node scripts/fix-review-filter-scope.mjs
      - name: Commit repaired prototype
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- dashboard-reference-prototype.html; then
            echo "No Review filter repair changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-reference-prototype.html
          git commit -m "fix: keep Review filter state in renderer scope"
          git push origin HEAD:fix/full-ui-route-audit
